[build]
  # Netlify's Next.js runtime owns the publish directory. Dependencies are
  # installed from the committed package-lock before this local script runs.
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  NPM_VERSION = "10.9.2"
  TINA_PUBLIC_CLIENT_ID = "40561aba-f9f7-4e3d-a8fa-d0149e35ca4b"
  # Configure TINA_TOKEN in Netlify's encrypted environment variables.
