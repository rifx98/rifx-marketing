<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba de Logo</title>
    <style>
        body {
            background-color: #ff0000; /* Fondo rojo brillante para que veas el corte */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
            color: white;
            font-family: sans-serif;
        }
        img {
            border: 5px solid white; /* Borde para ver los límites de la imagen */
            max-width: 80%;
        }
    </style>
</head>
<body>
    <h1>ESTA ES TU IMAGEN ORIGINAL (rifx-logo-user.png)</h1>
    <p>He puesto un fondo rojo y un borde blanco alrededor de tu imagen para que veas que el archivo ya viene recortado y con un círculo azul dibujado encima de la letra R.</p>
    <img src="/images/rifx-logo-user.png" alt="Tu Logo Original">
</body>
</html>
